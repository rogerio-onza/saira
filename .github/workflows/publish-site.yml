name: Publicar site (Quarto → GitHub Pages)

# Site de ajuda em website/ (Quarto). Independente do R-CMD-check:
# só roda quando o conteúdo do site muda.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'DESCRIPTION'  # version badge + "current version" derive from here
      - '.github/workflows/publish-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Renderizar o site (website/)
        run: quarto render website

      - name: Subir artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
