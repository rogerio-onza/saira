name: Publicar site (Quarto → GitHub Pages)

# Site de ajuda em website/ (Quarto). Independente do R-CMD-check:
# só roda quando o conteúdo do site muda.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'DESCRIPTION'  # version badge + "current version" derive from here
      - '.github/workflows/publish-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

      - name: Renderizar o site (website/)
        run: quarto render website

      - name: Subir artefato do Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job writes to Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
