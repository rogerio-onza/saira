name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

# A second push to a PR leaves the first run alive and both compete for the
# same apt mirror. Pushes to main are never cancelled: main's run is the one
# that publishes the dependency cache every PR restores from.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    # A healthy run is ~6 min: the R library comes from the cache and R CMD
    # check itself takes under 4. The variable cost is the system-requirements
    # layer, which setup-r-dependencies installs with apt on every run and no
    # cache covers. When the runner's Ubuntu mirror degrades it collapses to
    # tens of kB/s -- on 2026-08-19 one run spent 58 min on `Fetched 117 MB`
    # after a clean cache hit. Fail at 45 and re-run rather than burn two hours.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
      # Disable the committed renv autoloader in CI. Without this, renv/activate.R
      # redirects the package library to ~/.cache/R/renv/..., which (a) makes
      # r-lib/actions/setup-r-dependencies fail to cache ("no cache is being
      # saved") so every run reinstalls from scratch, and (b) forces ~160
      # packages to compile from source each run (~54 min). Disabling it lets the
      # action install into the standard library and cache it normally.
      RENV_CONFIG_AUTOLOADER_ENABLED: false
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
          extra-repositories: https://ropensci.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::devtools
            any::testthat
            ropensci/rnaturalearthhires
          dependencies: '"hard"'
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual")'
          error-on: '"error"'
