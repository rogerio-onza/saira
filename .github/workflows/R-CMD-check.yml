name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

# A second push to a PR leaves the first run alive and both compete for the
# same apt mirror. Pushes to main are never cancelled: main's run is the one
# that publishes the dependency cache every PR restores from.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    # A healthy run is ~6 min: the R library comes from the cache and R CMD
    # check itself takes under 4. The variable cost is the system-requirements
    # layer, which setup-r-dependencies installs with apt on every run and no
    # cache covers. When the runner's Ubuntu mirror degrades it collapses to
    # tens of kB/s -- on 2026-08-19 one run spent 58 min on `Fetched 117 MB`
    # after a clean cache hit. Fail at 45 and re-run rather than burn two hours.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
      # Disable the committed renv autoloader in CI. Without this, renv/activate.R
      # redirects the package library to ~/.cache/R/renv/..., which (a) makes
      # r-lib/actions/setup-r-dependencies fail to cache ("no cache is being
      # saved") so every run reinstalls from scratch, and (b) forces ~160
      # packages to compile from source each run (~54 min). Disabling it lets the
      # action install into the standard library and cache it normally.
      RENV_CONFIG_AUTOLOADER_ENABLED: false
    steps:
      # The runner resolves apt through a mirrorlist with
      # azure.archive.ubuntu.com first and archive.ubuntu.com behind it. When
      # the Azure mirror stops answering, apt spends its full default timeout
      # and three retries on every index and every package before failing over,
      # which is what turned a ~6-minute job into 45 on 2026-08-19. Capping the
      # wait makes the fallback immediate. On a healthy mirror these limits are
      # never reached, so a good run is unaffected.
      - name: Fail over fast when an apt mirror stops answering
        run: |
          sudo tee /etc/apt/apt.conf.d/99-fast-failover >/dev/null <<'CONF'
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::Retries "1";
          CONF

      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
          extra-repositories: https://ropensci.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::devtools
            any::testthat
            ropensci/rnaturalearthhires
          dependencies: '"hard"'
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual")'
          error-on: '"error"'

  # The checks R CMD check does not cover: roxygen and CSS output are current,
  # and the browser flows (E2E). scripts/release_gate.R holds the list, so a
  # local `--ci` run is the same job. The runner image has Google Chrome, which
  # chromote finds with no setup.
  gate:
    runs-on: ubuntu-latest
    name: Release gate (CI steps)
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_AUTOLOADER_ENABLED: false
    steps:
      - name: Fail over fast when an apt mirror stops answering
        run: |
          sudo tee /etc/apt/apt.conf.d/99-fast-failover >/dev/null <<'CONF'
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::Retries "1";
          CONF

      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
          extra-repositories: https://ropensci.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::testthat
            any::withr
            any::future
            any::furrr
            any::parallelly
            ropensci/rnaturalearthhires
          dependencies: '"hard"'

      # Not in the list above: pak maps the chromote system requirement to
      # Chromium from a Launchpad PPA, and that PPA answered 503 on 2026-10-21
      # and failed the job. install.packages() installs no system packages, and
      # chromote uses the Google Chrome of the runner image.
      - name: Install the browser test packages
        run: Rscript -e 'install.packages(c("shinytest2", "chromote"))'

      # The roxygen step compares with the committed files, so it needs the
      # roxygen2 version that wrote them, not the latest one.
      - name: Install the roxygen2 version of DESCRIPTION
        run: |
          Rscript -e 'v <- read.dcf("DESCRIPTION", fields = "Config/roxygen2/version")[[1]]; if (as.character(packageVersion("roxygen2")) != v) remotes::install_version("roxygen2", v, upgrade = "never")'

      - name: Run the CI steps of the release gate
        run: Rscript scripts/release_gate.R --ci

  # The two jobs above install the latest CRAN versions. This job restores
  # renv.lock, so the tests also run on the versions a developer has (ADR-167).
  lock:
    runs-on: ubuntu-latest
    name: Tests on renv.lock
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    steps:
      - name: Fail over fast when an apt mirror stops answering
        run: |
          sudo tee /etc/apt/apt.conf.d/99-fast-failover >/dev/null <<'CONF'
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::Retries "1";
          CONF

      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      # setup-r points renv at P3M only. rnaturalearthhires is on r-universe,
      # so the override names both repositories.
      - name: Point renv at P3M binaries and r-universe
        run: |
          echo "RENV_CONFIG_REPOS_OVERRIDE=CRAN=https://packagemanager.posit.co/cran/__linux__/$(lsb_release -cs)/latest;ropensci=https://ropensci.r-universe.dev" >> "$GITHUB_ENV"

      # setup-renv installs no system libraries. renv lists them from the
      # records of renv.lock, the development packages too (gert needs
      # libgit2). chromote is not in the list: its requirement is Chromium,
      # and chromote uses the Google Chrome of the runner image.
      - name: Install the system requirements
        env:
          RENV_CONFIG_AUTOLOADER_ENABLED: false
        run: |
          Rscript -e 'install.packages("renv", lib = Sys.getenv("R_LIBS_USER"))'
          pkgs=$(Rscript -e 'p <- setdiff(names(renv::lockfile_read()$Packages), "chromote"); s <- renv::sysreqs(p, source = "lockfile", recursive = FALSE, check = FALSE, report = FALSE); cat(unique(unlist(lapply(s, function(x) unlist(x$packages)))))')
          echo "System packages: $pkgs"
          sudo apt-get update
          sudo apt-get install -y $pkgs

      - uses: r-lib/actions/setup-renv@v2

      - name: Run the tests
        run: Rscript -e 'testthat::test_local(stop_on_failure = TRUE)'
