name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4

      - name: Add rOpenSci R-universe (florabr/faunabr/rnaturalearthhires)
        run: |
          echo "RSPM=https://r-universe.dev/bin/linux/jammy/4.4/" >> $GITHUB_ENV
          mkdir -p ~/.R
          cat <<EOF > ~/.Rprofile
          options(repos = c(
            ropensci = "https://ropensci.r-universe.dev",
            CRAN     = "https://cloud.r-project.org"
          ))
          EOF

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::devtools, any::testthat
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'

      - name: Run release gate (no E2E)
        if: success()
        env:
          RUN_E2E: ""
          NOT_CRAN: "true"
        run: |
          Rscript -e 'pkgload::load_all("."); testthat::test_local()'
