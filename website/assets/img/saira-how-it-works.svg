<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-label="Como funciona a Saíra em cinco etapas encadeadas: Upload, Mapeamento, Validação, Generalização e Exportar.">
  <defs>
    <linearGradient id="flow" x1="20" y1="0" x2="980" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38cff6"/>
      <stop offset="0.117" stop-color="#38cff6"/>
      <stop offset="0.308" stop-color="#2833ac"/>
      <stop offset="0.5" stop-color="#00a86b"/>
      <stop offset="0.692" stop-color="#6d28d9"/>
      <stop offset="0.883" stop-color="#0e8a95"/>
      <stop offset="1" stop-color="#0e8a95"/>
    </linearGradient>
    <marker id="flow-end" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="7" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#0e8a95"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="460" rx="16" fill="#f4f3ee"/>

  <text x="40" y="44" font-family="'Space Mono','IBM Plex Mono',monospace" font-size="16" font-weight="700" letter-spacing="2" fill="#2833ac">COMO FUNCIONA · DA PLANILHA AO DARWIN CORE</text>
  <line x1="40" y1="60" x2="196" y2="60" stroke="#2833ac" stroke-width="2" stroke-opacity="0.3" stroke-linecap="round"/>

  <!-- Continuous flow: one wave through the five stations -->
  <circle cx="26" cy="307" r="4.5" fill="#38cff6"/>
  <path d="M26,307 C62,303 100,290 132,250 C178,222 270,222 316,250 C362,278 454,278 500,250 C546,222 638,222 684,250 C730,278 822,278 868,250 C902,247 932,231 958,199"
        fill="none" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" marker-end="url(#flow-end)"/>

  <!-- Stems tying each label block to its station -->
  <g stroke="#6c757d" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="132" y1="272" x2="132" y2="304"/>
    <line x1="316" y1="228" x2="316" y2="196"/>
    <line x1="500" y1="272" x2="500" y2="304"/>
    <line x1="684" y1="228" x2="684" y2="196"/>
    <line x1="868" y1="272" x2="868" y2="304"/>
  </g>

  <!-- Station 1: Upload (#38cff6), label below -->
  <circle cx="132" cy="250" r="22" fill="#38cff6" stroke="#f4f3ee" stroke-width="5"/>
  <g stroke="#1c1c26" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="132" y1="254" x2="132" y2="243"/>
    <path d="M126,248 L132,242 L138,248"/>
    <path d="M124,253 V258 H140 V253"/>
  </g>
  <text x="132" y="328" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace" font-size="12" font-weight="700" letter-spacing="1.5" fill="#0f8fb5">01</text>
  <text x="132" y="356" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace" font-size="18" font-weight="700" fill="#1c1c26">Upload</text>
  <text x="132" y="382" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="14" fill="#5a6169">CSV, TSV ou Camtrap DP</text>
  <text x="132" y="402" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="14" fill="#5a6169">com detecção automática</text>

  <!-- Station 2: Mapeamento (#2833ac), label above -->
  <circle cx="316" cy="250" r="22" fill="#2833ac" stroke="#f4f3ee" stroke-width="5"/>
  <g stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="304" y="242" width="7" height="16" rx="2"/>
    <rect x="321" y="242" width="7" height="16" rx="2"/>
    <line x1="313" y1="250" x2="318" y2="250"/>
  </g>
  <text x="316" y="124" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace" font-size="12" font-weight="700" letter-spacing="1.5" fill="#2833ac">02</text>
  <text x="316" y="152" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace" font-size="18" font-weight="700" fill="#1c1c26">Mapeamento</text>
  <text x="316" y="178" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="14" fill="#5a6169">suas colunas viram termos</text>
  <text x="316" y="198" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="14" fill="#5a6169">do Darwin Core</text>

  <!-- Station 3: Validação (#00a86b), label below -->
  <circle cx="500" cy="250" r="22" fill="#00a86b" stroke="#f4f3ee" stroke-width="5"/>
  <g stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M492,250 L498,256 L509,244"/>
  </g>
  <text x="500" y="328" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace" font-size="12" font-weight="700" letter-spacing="1.5" fill="#00875a">03</text>
  <text x="500" y="356" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace" font-size="18" font-weight="700" fill="#1c1c26">Validação</text>
  <text x="500" y="382" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="14" fill="#5a6169">nomes e coordenadas contra</text>
  <text x="500" y="402" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="14" fill="#5a6169">GBIF e Flora/Fauna BR</text>

  <!-- Station 4: Generalização (#6d28d9), label above -->
  <circle cx="684" cy="250" r="22" fill="#6d28d9" stroke="#f4f3ee" stroke-width="5"/>
  <g stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M684,240 L692,244 V251 C692,257 684,260 684,260 C684,260 676,257 676,251 V244 Z"/>
  </g>
  <text x="684" y="124" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6d28d9">04</text>
  <text x="684" y="152" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace" font-size="18" font-weight="700" fill="#1c1c26">Generalização</text>
  <text x="684" y="178" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="14" fill="#5a6169">protege espécies ameaçadas</text>
  <text x="684" y="198" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="14" fill="#5a6169">seguindo Chapman/GBIF</text>

  <!-- Station 5: Exportar (#0e8a95), label below -->
  <circle cx="868" cy="250" r="22" fill="#0e8a95" stroke="#f4f3ee" stroke-width="5"/>
  <g stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="859" y="241" width="18" height="17" rx="2"/>
    <line x1="868" y1="245" x2="868" y2="253"/>
    <path d="M864,249 L868,253 L872,249"/>
  </g>
  <text x="868" y="328" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace" font-size="12" font-weight="700" letter-spacing="1.5" fill="#0e8a95">05</text>
  <text x="868" y="356" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace" font-size="18" font-weight="700" fill="#1c1c26">Exportar</text>
  <text x="868" y="382" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="14" fill="#5a6169">Darwin Core Archive pronto</text>
  <text x="868" y="402" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="14" fill="#5a6169">para o IPT do SiBBr/GBIF</text>
</svg>
