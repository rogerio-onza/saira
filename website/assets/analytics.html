<!-- Umami: privacy-friendly, cookieless web analytics (tracks page views on every page). -->
<!-- The site serves its own reviewed copy of the tracker (ADR-183). quarto:offset leads to the site root from any page. -->
<script>
(function () {
  var offset = document.querySelector('meta[name="quarto:offset"]');
  var tracker = document.createElement("script");
  tracker.src = (offset ? offset.getAttribute("content") : "./") + "assets/js/umami.js";
  tracker.setAttribute("data-website-id", "720ee0bd-2a87-4c0f-9a8f-f2e516fcf3ed");
  document.head.appendChild(tracker);
})();
</script>
