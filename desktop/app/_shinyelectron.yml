app:
  name: "Saíra (prévia)"
  slug: saira-desktop-preview
  version: "1.0.0-desktop.5"
  description: "Prévia local do Saíra desktop, baseada na preparação da v1.0."
  author: "Rogério Nunes Oliveira"

build:
  type: r-shiny
  runtime_strategy: bundled
  platforms: [win]
  architectures: [x64]

dependencies:
  auto_detect: false
  r:
    version: "4.5.2"
    # CRAN as it was on the renv.lock date. build.R checks the bundle against the lock.
    repos: ["https://packagemanager.posit.co/cran/2026-10-22"]
    packages: []
    prune: true
    # build.R supplies the exact local source archive in a staging folder.
    local_packages: []
  electron:
    version: "45.1.0"

window:
  width: 1280
  height: 850

splash:
  enabled: true
  text: "Abrindo o Saíra…"
  duration: 0

preloader:
  message: "Preparando o aplicativo…"
  style: spinner

tray:
  enabled: false

menu:
  template: minimal
  show_dev_tools: false

updates:
  enabled: false
  check_on_startup: false
  auto_download: false
  auto_install: false

signing:
  sign: false

installer:
  app_id: org.saira.desktop.preview
  one_click: false
  per_machine: false
  allow_to_change_installation_directory: true

logging:
  log_level: info
