<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" role="img" aria-label="How Saíra works in five steps: Upload, Mapping, Validation, Generalization and Export.">
  <defs>
    <marker id="ah-step" viewBox="0 0 8 8" markerWidth="6.5" markerHeight="6.5" refX="6" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7 Z" fill="#2833ac"/></marker>
    <marker id="ah-map" viewBox="0 0 8 8" markerWidth="6" markerHeight="6" refX="6" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7 Z" fill="#2833ac"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="240" rx="14" fill="#f4f3ee"/>

  <!-- Section title -->
  <text x="40" y="40" font-family="'Space Mono','IBM Plex Mono',monospace" font-size="14" font-weight="700" letter-spacing="1.5" fill="#2833ac">HOW IT WORKS — FROM SPREADSHEET TO DARWIN CORE</text>

  <!-- Connectors -->
  <line x1="194" y1="145" x2="205" y2="145" stroke="#2833ac" stroke-width="2" stroke-opacity="0.4" marker-end="url(#ah-step)"/>
  <line x1="380" y1="145" x2="391" y2="145" stroke="#2833ac" stroke-width="2" stroke-opacity="0.4" marker-end="url(#ah-step)"/>
  <line x1="566" y1="145" x2="577" y2="145" stroke="#2833ac" stroke-width="2" stroke-opacity="0.4" marker-end="url(#ah-step)"/>
  <line x1="752" y1="145" x2="763" y2="145" stroke="#2833ac" stroke-width="2" stroke-opacity="0.4" marker-end="url(#ah-step)"/>

  <!-- Card 1: Upload (primary #38cff6) -->
  <rect x="24" y="70" width="168" height="150" rx="10" fill="#ffffff" stroke="#2833ac" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="46" cy="92" r="13" fill="#38cff6"/>
  <text x="46" y="96" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace" font-size="11" font-weight="700" fill="#1c1c26">1</text>
  <g stroke="#38cff6" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="108" y1="124" x2="108" y2="107"/>
    <path d="M101,113 L108,106 L115,113"/>
    <path d="M95,126 V132 H121 V126"/>
  </g>
  <text x="108" y="160" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace" font-size="12.5" font-weight="700" fill="#1c1c26">Upload</text>
  <text x="108" y="182" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="10.5" fill="#6c757d">CSV, Excel and Camtrap DP</text>
  <text x="108" y="198" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="10.5" fill="#6c757d">(full compatibility)</text>

  <!-- Card 2: Mapping (accent #2833ac) -->
  <rect x="210" y="70" width="168" height="150" rx="10" fill="#ffffff" stroke="#2833ac" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="232" cy="92" r="13" fill="#2833ac"/>
  <text x="232" y="96" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <g stroke="#2833ac" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="278" y="106" width="11" height="20" rx="2"/>
    <rect x="299" y="106" width="11" height="20" rx="2"/>
    <line x1="290" y1="116" x2="297" y2="116" marker-end="url(#ah-map)"/>
  </g>
  <text x="294" y="160" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace" font-size="12.5" font-weight="700" fill="#1c1c26">Mapping</text>
  <text x="294" y="182" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="10.5" fill="#6c757d">Columns → Darwin</text>
  <text x="294" y="198" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="10.5" fill="#6c757d">Core terms</text>

  <!-- Card 3: Validation (success #00a86b) -->
  <rect x="396" y="70" width="168" height="150" rx="10" fill="#ffffff" stroke="#2833ac" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="418" cy="92" r="13" fill="#00a86b"/>
  <text x="418" y="96" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <g stroke="#00a86b" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="480" cy="116" r="12"/>
    <path d="M473,116 L478,121 L487,109"/>
  </g>
  <text x="480" y="160" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace" font-size="12.5" font-weight="700" fill="#1c1c26">Validation</text>
  <text x="480" y="182" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="10.5" fill="#6c757d">Names vs GBIF backbone,</text>
  <text x="480" y="198" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="10.5" fill="#6c757d">Flora/Fauna BR + coords</text>

  <!-- Card 4: Generalization (swapped #6d28d9) -->
  <rect x="582" y="70" width="168" height="150" rx="10" fill="#ffffff" stroke="#2833ac" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="604" cy="92" r="13" fill="#6d28d9"/>
  <text x="604" y="96" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <g stroke="#6d28d9" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M666,103 L677,108 V117 C677,124 666,129 666,129 C666,129 655,124 655,117 V108 Z"/>
  </g>
  <text x="666" y="160" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace" font-size="12.5" font-weight="700" fill="#1c1c26">Generalization</text>
  <text x="666" y="182" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="10.5" fill="#6c757d">Protect threatened</text>
  <text x="666" y="198" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="10.5" fill="#6c757d">species · Chapman/GBIF</text>

  <!-- Card 5: Export (primary-dark #0e8a95) -->
  <rect x="768" y="70" width="168" height="150" rx="10" fill="#ffffff" stroke="#2833ac" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="790" cy="92" r="13" fill="#0e8a95"/>
  <text x="790" y="96" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">5</text>
  <g stroke="#0e8a95" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="841" y="104" width="22" height="24" rx="2"/>
    <line x1="852" y1="109" x2="852" y2="121"/>
    <path d="M847,116 L852,121 L857,116"/>
  </g>
  <text x="852" y="160" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace" font-size="12.5" font-weight="700" fill="#1c1c26">Export</text>
  <text x="852" y="182" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="10.5" fill="#6c757d">Darwin Core Archive</text>
  <text x="852" y="198" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="10.5" fill="#6c757d">in the IPT/GBIF format</text>
</svg>
